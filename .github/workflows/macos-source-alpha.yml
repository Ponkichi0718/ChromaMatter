name: macOS Source-backed App Alpha 2

on:
  push:
    branches:
      - "main"
    tags:
      - "v0.8beta-macos-source-alpha*"
      - "v0.8beta-macos-source-app-alpha*"
    paths:
      - ".github/ISSUE_TEMPLATE/macos_alpha_report.yml"
      - ".github/workflows/macos-source-alpha.yml"
      - "START_MACOS_SOURCE_ALPHA.command"
      - "tooling/stage_macos_source_app.py"
      - "tooling/stage_macos_source_package.py"
      - "publication/MACOS_ALPHA_SOURCE_TESTER_*.md"
      - "publication/MACOS_ALPHA_TESTING_*.md"
      - "publication/MACOS_SOURCE_APP_TESTING_EN.md"
      - "samples/LICENSE.txt"
      - "samples/MACOS_ALPHA_TEST_MODEL_README.md"
      - "samples/generate_macos_alpha_test_glb.py"
      - "source/fixed_app/requirements-runtime-macos-arm64.lock"
      - "source/fixed_app/assets/**"
      - "source/fixed_app/licenses/**"
      - "source/fixed_app/public_binary/DemoData/**"
      - "source/fixed_app/resources/**"
      - "source/fixed_app/spectrum_mapper/**"
      - "source/fixed_app/*.py"
      - "source/fixed_app/TripoSpectrumMapper_fixed.py"
      - "source/fixed_app/test_macos_source_launcher.py"
      - "source/fixed_app/test_macos_source_app.py"
      - "source/fixed_app/test_macos_source_package.py"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/ISSUE_TEMPLATE/macos_alpha_report.yml"
      - ".github/workflows/macos-source-alpha.yml"
      - "START_MACOS_SOURCE_ALPHA.command"
      - "tooling/stage_macos_source_app.py"
      - "tooling/stage_macos_source_package.py"
      - "publication/MACOS_ALPHA_SOURCE_TESTER_*.md"
      - "publication/MACOS_ALPHA_TESTING_*.md"
      - "publication/MACOS_SOURCE_APP_TESTING_EN.md"
      - "samples/LICENSE.txt"
      - "samples/MACOS_ALPHA_TEST_MODEL_README.md"
      - "samples/generate_macos_alpha_test_glb.py"
      - "source/fixed_app/requirements-runtime-macos-arm64.lock"
      - "source/fixed_app/assets/**"
      - "source/fixed_app/licenses/**"
      - "source/fixed_app/public_binary/DemoData/**"
      - "source/fixed_app/resources/**"
      - "source/fixed_app/spectrum_mapper/**"
      - "source/fixed_app/*.py"
      - "source/fixed_app/TripoSpectrumMapper_fixed.py"
      - "source/fixed_app/test_macos_source_launcher.py"
      - "source/fixed_app/test_macos_source_app.py"
      - "source/fixed_app/test_macos_source_package.py"
  workflow_dispatch:
    inputs:
      upload_source_app_alpha:
        description: "Upload the tested source-backed Alpha 2 package ZIP as a short-lived workflow artifact"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-source-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-launcher-test:
    name: macOS 15 arm64 source-backed app Alpha 2
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up CPython 3.13.14 arm64
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"
          architecture: arm64

      - name: Verify source tester host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(python -c 'import platform; print(platform.machine())')" = arm64
          test "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.14
          test "$(sw_vers -productVersion | awk -F. '{print $1}')" -ge 15

      - name: Validate launcher contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./START_MACOS_SOURCE_ALPHA.command
          python -m unittest \
            source.fixed_app.test_macos_source_launcher \
            source.fixed_app.test_macos_source_app \
            source.fixed_app.test_macos_source_package

      - name: Stage and audit Finder source-backed app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ChromaMatter Source Alpha.app"
          python tooling/stage_macos_source_app.py stage \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$app" \
            --source-commit "$GITHUB_SHA"
          test -x "$app/Contents/MacOS/ChromaMatterSourceAlpha"
          test -x "$app/Contents/Resources/ChromaMatterSource/START_MACOS_SOURCE_ALPHA.command"
          bash -n "$app/Contents/MacOS/ChromaMatterSourceAlpha"
          bash -n "$app/Contents/Resources/ChromaMatterSource/START_MACOS_SOURCE_ALPHA.command"
          python tooling/stage_macos_source_app.py audit \
            --app-bundle "$app" \
            >"$RUNNER_TEMP/chromamatter-source-app-audit.json"

      - name: Run source tester setup and native/render gate
        shell: bash
        env:
          CHROMAMATTER_ALPHA_HOME: ${{ runner.temp }}/chromamatter-source-alpha
        run: |
          set -euo pipefail
          export CHROMAMATTER_PYTHON="$(command -v python)"
          app_entry="$RUNNER_TEMP/ChromaMatter Source Alpha.app/Contents/MacOS/ChromaMatterSourceAlpha"
          "$app_entry" --self-test-only
          test -s "$CHROMAMATTER_ALPHA_HOME/TestData/ChromaMatter-Public-Four-Color-Test.glb"
          test -s "$CHROMAMATTER_ALPHA_HOME/Validation/macos-alpha-self-test.json"
          python - "$CHROMAMATTER_ALPHA_HOME/Validation/macos-alpha-self-test.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          if payload.get("ok") is not True:
              raise SystemExit("Source launcher self-test did not report ok=true")
          PY

      - name: Smoke-test Japanese and English source UI
        shell: bash
        env:
          CHROMAMATTER_ALPHA_HOME: ${{ runner.temp }}/chromamatter-source-alpha
          CHROMAMATTER_DATA_DIRECTORY: ${{ runner.temp }}/chromamatter-source-alpha/Profile
        run: |
          set -euo pipefail
          runtime="$CHROMAMATTER_ALPHA_HOME/venv-3.13.14/bin/python"
          source_root="$RUNNER_TEMP/ChromaMatter Source Alpha.app/Contents/Resources/ChromaMatterSource"
          export PYTHONPATH="$source_root:$source_root/source/fixed_app"
          entry="$source_root/source/fixed_app/TripoSpectrumMapper_fixed.py"
          "$runtime" "$entry" --ui-smoke --ui-smoke-language ja
          "$runtime" "$entry" --ui-smoke --ui-smoke-language en

      - name: Download and extract immutable stable r32.2 DemoData
        shell: bash
        run: |
          set -euo pipefail
          stable_name="ChromaMatter-0.8beta-r32.2-win64.zip"
          stable_zip="$RUNNER_TEMP/$stable_name"
          stable_url="https://github.com/Ponkichi0718/ChromaMatter/releases/download/v0.8beta-r32.2/ChromaMatter-0.8beta-r32.2-win64.zip"
          stable_sha256="2ceada98661bac5d49b759542151c4c484fff4269d6b5d142ec32fec544f06d0"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --output "$stable_zip" \
            "$stable_url"
          test "$(stat -f %z "$stable_zip")" = "327268369"
          test "$(shasum -a 256 "$stable_zip" | awk '{print $1}')" = \
            "$stable_sha256"
          (
            cd "$RUNNER_TEMP"
            printf '%s  %s\n' "$stable_sha256" "$stable_name" \
              >"$stable_name.sha256"
            shasum -a 256 -c "$stable_name.sha256"
          )
          python tooling/stage_macos_source_package.py extract-demo \
            --repository-root "$GITHUB_WORKSPACE" \
            --stable-archive "$stable_zip" \
            --output "$RUNNER_TEMP/DemoData" \
            --source-commit "$GITHUB_SHA" \
            >"$RUNNER_TEMP/chromamatter-stable-demo-data-extract.json"

      - name: Package, audit, and fresh-extract Alpha 2
        shell: bash
        env:
          CHROMAMATTER_ALPHA_HOME: ${{ runner.temp }}/chromamatter-source-alpha
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ChromaMatter Source Alpha.app"
          package_name="ChromaMatter-0.8beta-macos-source-app-alpha2"
          package_root="$RUNNER_TEMP/$package_name"
          archive="$RUNNER_TEMP/$package_name.zip"
          fresh="$RUNNER_TEMP/chromamatter-source-app-alpha2-fresh"
          stable_zip="$RUNNER_TEMP/ChromaMatter-0.8beta-r32.2-win64.zip"
          demo_data="$RUNNER_TEMP/DemoData"
          public_glb="$CHROMAMATTER_ALPHA_HOME/TestData/ChromaMatter-Public-Four-Color-Test.glb"
          python tooling/stage_macos_source_package.py stage \
            --repository-root "$GITHUB_WORKSPACE" \
            --app-bundle "$app" \
            --demo-data-root "$demo_data" \
            --stable-archive "$stable_zip" \
            --public-test-glb "$public_glb" \
            --output "$package_root" \
            --source-commit "$GITHUB_SHA" \
            >"$RUNNER_TEMP/chromamatter-source-package-stage.json"
          python tooling/stage_macos_source_package.py audit \
            --repository-root "$GITHUB_WORKSPACE" \
            --package-root "$package_root" \
            >"$RUNNER_TEMP/chromamatter-source-package-prearchive-audit.json"
          ditto -c -k --keepParent "$package_root" "$archive"
          mkdir "$fresh"
          ditto -x -k "$archive" "$fresh"
          test "$(find "$fresh" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          fresh_root="$fresh/$package_name"
          fresh_app="$fresh_root/ChromaMatter Source Alpha.app"
          python tooling/stage_macos_source_package.py audit \
            --repository-root "$GITHUB_WORKSPACE" \
            --package-root "$fresh_root" \
            >"$RUNNER_TEMP/chromamatter-source-package-fresh-audit.json"
          python tooling/stage_macos_source_app.py audit \
            --app-bundle "$fresh_app" \
            >"$RUNNER_TEMP/chromamatter-source-app-fresh-audit.json"
          test -x "$fresh_app/Contents/MacOS/ChromaMatterSourceAlpha"
          test -x "$fresh_app/Contents/Resources/ChromaMatterSource/START_MACOS_SOURCE_ALPHA.command"
          test -s "$fresh_root/README_INSTALL_AND_TEST_EN.md"
          test -s "$fresh_root/SOURCE_BACKED_ALPHA_NOTICE.txt"
          test -s "$fresh_root/ChromaMatter-Public-Four-Color-Test.glb"
          test "$(find "$fresh_root/DemoData" -type f | wc -l | tr -d ' ')" = 15
          (
            cd "$fresh_root"
            shasum -a 256 -c ChromaMatter-Public-Four-Color-Test.glb.sha256
            shasum -a 256 -c SOFTWARE_PACKAGE_SHA256.txt
          )
          python - \
            "$GITHUB_SHA" \
            "$fresh_root/SOURCE_COMMIT.txt" \
            "$fresh_root/SOURCE_APP_PACKAGE_MANIFEST.json" \
            "$fresh_app/Contents/Resources/SOURCE_BACKED_APP_MANIFEST.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          workflow_commit = sys.argv[1].casefold()
          root_commit = Path(sys.argv[2]).read_text(encoding="ascii").strip()
          manifest_commit = json.loads(
              Path(sys.argv[3]).read_text(encoding="ascii")
          )["source_commit"]
          app_commit = json.loads(
              Path(sys.argv[4]).read_text(encoding="ascii")
          )["source_commit"]
          if (
              workflow_commit != root_commit
              or root_commit != manifest_commit
              or root_commit != app_commit
          ):
              raise SystemExit(
                  "workflow, package-root, outer-manifest, and app-manifest source commits differ"
              )
          PY
          export CHROMAMATTER_PYTHON="$(command -v python)"
          "$fresh_app/Contents/MacOS/ChromaMatterSourceAlpha" --self-test-only
          self_test_report="$CHROMAMATTER_ALPHA_HOME/Validation/macos-alpha-self-test.json"
          rm -f "$self_test_report"
          open -W -n \
            --env "CHROMAMATTER_ALPHA_HOME=$CHROMAMATTER_ALPHA_HOME" \
            --env "CHROMAMATTER_PYTHON=$CHROMAMATTER_PYTHON" \
            "$fresh_app" --args --self-test-only
          test -s "$self_test_report"
          python - "$self_test_report" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          if payload.get("ok") is not True:
              raise SystemExit("LaunchServices source-app self-test did not report ok=true")
          PY
          cp "$self_test_report" \
            "$RUNNER_TEMP/macos-source-app-launchservices-self-test.json"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$package_name.zip" >"$package_name.zip.sha256"
            shasum -a 256 -c "$package_name.zip.sha256"
            cp "$package_name.zip.sha256" SHA256SUMS-macos-source-app-alpha2.txt
          )

      - name: Record Alpha 2 diagnostics
        if: always()
        shell: bash
        env:
          CHROMAMATTER_ALPHA_HOME: ${{ runner.temp }}/chromamatter-source-alpha
        run: |
          set -u
          diagnostic="$RUNNER_TEMP/chromamatter-source-alpha2-diagnostics"
          mkdir -p "$diagnostic"
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a || true
            sw_vers || true
            python --version || true
          } >"$diagnostic/CI_ENVIRONMENT.txt"
          report="$CHROMAMATTER_ALPHA_HOME/Validation/macos-alpha-self-test.json"
          if [[ -f "$report" ]]; then
            cp "$report" "$diagnostic/"
          fi
          for evidence in \
            "$RUNNER_TEMP/chromamatter-source-app-audit.json" \
            "$RUNNER_TEMP/chromamatter-stable-demo-data-extract.json" \
            "$RUNNER_TEMP/chromamatter-source-package-stage.json" \
            "$RUNNER_TEMP/chromamatter-source-package-prearchive-audit.json" \
            "$RUNNER_TEMP/chromamatter-source-package-fresh-audit.json" \
            "$RUNNER_TEMP/chromamatter-source-app-fresh-audit.json" \
            "$RUNNER_TEMP/macos-source-app-launchservices-self-test.json" \
            "$RUNNER_TEMP/chromamatter-source-app-alpha2-fresh/ChromaMatter-0.8beta-macos-source-app-alpha2/SOURCE_APP_PACKAGE_MANIFEST.json" \
            "$RUNNER_TEMP/chromamatter-source-app-alpha2-fresh/ChromaMatter-0.8beta-macos-source-app-alpha2/SOFTWARE_PACKAGE_SHA256.txt" \
            "$RUNNER_TEMP/ChromaMatter-0.8beta-r32.2-win64.zip.sha256" \
            "$RUNNER_TEMP/ChromaMatter-0.8beta-macos-source-app-alpha2.zip.sha256" \
            "$RUNNER_TEMP/SHA256SUMS-macos-source-app-alpha2.txt"; do
            if [[ -f "$evidence" ]]; then
              cp "$evidence" "$diagnostic/"
            fi
          done

      - name: Upload Alpha 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChromaMatter-macOS-source-alpha2-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/chromamatter-source-alpha2-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-backed Alpha 2 package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_source_app_alpha == true
        uses: actions/upload-artifact@v4
        with:
          name: ChromaMatter-0.8beta-macos-source-app-alpha2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ChromaMatter-0.8beta-macos-source-app-alpha2.zip
            ${{ runner.temp }}/ChromaMatter-0.8beta-macos-source-app-alpha2.zip.sha256
            ${{ runner.temp }}/SHA256SUMS-macos-source-app-alpha2.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          demo_status="did not complete"
          if [[ -s "$RUNNER_TEMP/chromamatter-stable-demo-data-extract.json" ]]; then
            demo_status="verified and staged exactly 15 canonical files"
          fi
          package_status="did not complete"
          if [[ \
            -s "$RUNNER_TEMP/chromamatter-source-package-prearchive-audit.json" \
            && -s "$RUNNER_TEMP/chromamatter-source-package-fresh-audit.json" \
            && -s "$RUNNER_TEMP/ChromaMatter-0.8beta-macos-source-app-alpha2.zip.sha256" \
          ]]; then
            package_status="passed before ZIP creation and after fresh extraction"
          fi
          launch_status="did not complete"
          if [[ -s "$RUNNER_TEMP/macos-source-app-launchservices-self-test.json" ]]; then
            launch_status="fresh-extracted app opened with \`open -W -n\` and passed self-test"
          fi
          {
            echo "## macOS Source-backed App Alpha 2"
            echo
            echo "- Exact source: \`$GITHUB_SHA\`"
            echo "- Host: Apple Silicon / macOS 15"
            echo "- Launcher: \`START_MACOS_SOURCE_ALPHA.command\`"
            echo "- Finder bundle: \`ChromaMatter Source Alpha.app\` (source-backed; no bundled Python/runtime/Mach-O)"
            echo "- Candidate ZIP: \`ChromaMatter-0.8beta-macos-source-app-alpha2.zip\`"
            echo "- Stable DemoData source: exact 327,268,369-byte \`v0.8beta-r32.2\` Windows ZIP; $demo_status."
            echo "- Package audit: $package_status."
            echo "- Finder/LaunchServices: $launch_status."
            echo "- The app ZIP is uploaded only when the manual upload input is enabled."
            echo "- Diagnostics contain audit JSON and checksum text only, not either large ZIP or the DemoData payload."
            echo "- This validates the source-backed tester path only. It is not evidence for the frozen prebuilt or notarized app."
          } >>"$GITHUB_STEP_SUMMARY"
