name: CM 2.4.0 Apple Silicon trial
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public ChromaMatter release URL for the reviewed full source packet
        required: true
        type: string
      source_sha256:
        description: SHA256 of that exact packet
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Share the existing Contour Trial group to serialize both Mac workflows.
  group: contour-trial-arm64
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Ponkichi0718/ChromaMatter'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.14'
          architecture: arm64
      - name: Fetch reviewed source packet
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://github.com/Ponkichi0718/ChromaMatter/releases/download/*/CM-240-Mac-BuildInputs-*.tar.gz ]]
          [[ "$SOURCE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          curl --fail --location --retry 2 --proto '=https' --proto-redir '=https' "$SOURCE_URL" -o cm240-inputs.tar.gz
          printf '%s  cm240-inputs.tar.gz\n' "$SOURCE_SHA256" | shasum -a 256 -c -
          python build-config/ci/cm240_packet.py extract --archive cm240-inputs.tar.gz --destination "$GITHUB_WORKSPACE"
          python -c "import platform, tkinter; assert platform.machine() == 'arm64'; print('arm64, Tk', tkinter.TkVersion)"
      - name: Consistent cache compression and build tools
        run: |
          python -m pip install cmake==3.31.10 ninja==1.11.1.4
          brew install automake texinfo libtool gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          if brew list zstd >/dev/null 2>&1; then brew unlink zstd; fi
      - uses: actions/cache/restore@v4
        id: helper-cache
        with:
          path: helper-build/dist
          key: cm240-arm64-py31314-helpers-v1-${{ hashFiles('helpers/**', 'build-config/ci/cm240_helpers*') }}
      - name: Build matching native helpers
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --only-binary=:all: -r build-config/ci/cm240_helpers_requirements.txt
          for pair in importer:cm-glb-import editor:cm-paint-editor; do
            folder=${pair%%:*}
            name=${pair#*:}
            CM_HELPER_SOURCE="$PWD/helpers/$folder" CM_HELPER_NAME="$name" \
              python -m PyInstaller --noconfirm --workpath "helper-build/work/$name" \
              --distpath helper-build/dist build-config/ci/cm240_helpers.spec
          done
      - name: Helper packaging preflight
        run: bash build-config/ci/cm240_build_macos.sh preflight
      - name: Save verified helpers before native dependencies
        uses: actions/cache/save@v4
        if: success() && steps.helper-cache.outputs.cache-hit != 'true'
        with:
          path: helper-build/dist
          key: ${{ steps.helper-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: app-cache
        with:
          path: cm-build/app/src/Snapmaker_Orca.app
          key: cm240-arm64-xcode162-app-v1-${{ inputs.source_sha256 }}-${{ hashFiles('build-config/ci/cm240_build_macos.sh') }}
      - uses: actions/cache/restore@v4
        if: steps.app-cache.outputs.cache-hit != 'true'
        id: deps-cache
        with:
          path: |
            cm-build/deps
            cm-build/deps-install
            cm-build/downloads
          key: cm240-arm64-xcode162-deps-v1-${{ hashFiles('native/deps/**', 'build-config/ci/cm240_build_macos.sh') }}-${{ github.run_id }}
          restore-keys: cm240-arm64-xcode162-deps-v1-${{ hashFiles('native/deps/**', 'build-config/ci/cm240_build_macos.sh') }}-
      - name: Normalize dependency patch line endings
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for patch in sorted(Path('native/deps').rglob('*.patch')):
              original = patch.read_bytes()
              normalized = original.replace(b'\r\n', b'\n')
              if normalized != original:
                  patch.write_bytes(normalized)
                  changed += 1
                  print(patch.as_posix())
          print(f'Normalized {changed} dependency patches; source packet unchanged')
          PY
      - name: Build dependencies from the 2.4.0 recipes
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: bash build-config/ci/cm240_build_macos.sh deps
      - uses: actions/cache/save@v4
        if: always() && steps.deps-cache.outputs.cache-primary-key != '' && steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            cm-build/deps
            cm-build/deps-install
            cm-build/downloads
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Build CM 2.4.0
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: bash build-config/ci/cm240_build_macos.sh app
      - uses: actions/cache/save@v4
        if: steps.app-cache.outputs.cache-hit != 'true' && success()
        with:
          path: cm-build/app/src/Snapmaker_Orca.app
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Package and minimal CLI/signature checks
        run: bash build-config/ci/cm240_build_macos.sh package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CM-240-Window1-arm64
          path: artifacts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
