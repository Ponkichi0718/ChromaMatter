name: macOS alpha reproducible problem
description: Report one reproducible Apple Silicon macOS 15+ alpha defect.
title: "[macOS alpha]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test ChromaMatter. This form accepts the current Source-backed App Alpha 2, the older command-based Source Tester Alpha, and a future gated self-contained app. Source-backed App Alpha 1 remains immutable historical evidence. Use Discussions for successful results, setup questions, and general observations. Use this form for one reproducible defect. Do **not** upload a private, purchased, customer, or third-party model. Remove names, home paths, account details, and other sensitive data from evidence.

  - type: dropdown
    id: test_route
    attributes:
      label: Test route
      options:
        - Source-backed App Alpha 2 (ChromaMatter Source Alpha.app)
        - Source Tester Alpha (tagged source + START_MACOS_SOURCE_ALPHA.command)
        - Future gated self-contained app artifact
    validations:
      required: true

  - type: input
    id: source_tag
    attributes:
      label: Exact source tag
      description: Enter the exact tag for the Source-backed App or Source Tester. A future gated self-contained app tester may enter N/A.
      placeholder: v0.8beta-macos-source-app-alpha2
    validations:
      required: true

  - type: input
    id: workflow_run
    attributes:
      label: Approved workflow run URL or run ID (gated .app only)
      description: Leave blank for either source-backed route. A future gated self-contained app tester must copy the approved run from macOS Alpha Testing discussion #9.
      placeholder: "Future self-contained app only: https://github.com/Ponkichi0718/ChromaMatter/actions/runs/..."

  - type: input
    id: artifact
    attributes:
      label: Artifact filename and ZIP SHA-256 (Release)
      description: Source-backed App users enter the downloaded ZIP and SHA-256 verified against SHA256SUMS-macos-source-app-alpha2.txt. Command-based Source Tester users may leave this blank. A future self-contained app tester must include the approved artifact identity.
      placeholder: "ChromaMatter-0.8beta-macos-source-app-alpha2.zip / C112396513B0EA21CD867ED016E2D5282F830235E3EBF324E45E3B4FDB647989"

  - type: input
    id: source_commit
    attributes:
      label: Alpha source commit
      description: Source-backed App users copy this from SOURCE_COMMIT.txt. It is optional for command-based Source Tester users.
      placeholder: 34e7ebdc3ec7dae6ad831b5119d574a656b105b0

  - type: dropdown
    id: source_launcher
    attributes:
      label: Source launcher result
      description: Both source-backed routes use the same visible, hash-locked setup in Terminal.
      options:
        - Python installed; Return pressed; dependencies and self-test passed
        - Python was already installed; dependencies and self-test passed
        - Failed while checking Mac or macOS version
        - Failed while downloading or verifying Python
        - Failed while installing hash-locked dependencies
        - Failed during automatic self-test
        - Window failed after self-test passed
        - Not applicable - future self-contained app artifact
    validations:
      required: true

  - type: input
    id: mac_model
    attributes:
      label: Mac model, chip, and RAM
      placeholder: MacBook Air (M2, 2022), 16 GB
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true

  - type: dropdown
    id: first_launch
    attributes:
      label: First-launch result
      options:
        - Source-backed app opened with Control-click > Open
        - Source-backed app opened normally after first setup
        - Source launcher opened with Control-click > Open
        - Source launcher opened normally after first setup
        - Future self-contained app opened normally
        - Future self-contained app opened with Finder Open
        - Future self-contained app opened after Privacy & Security approval
        - Still blocked by macOS
        - Crashed or closed immediately
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Colour mode when the problem occurred
      options:
        - Full Spectrum
        - Flat Four
        - Both
        - Not applicable / did not reach this step
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Basic checklist results
      description: Enter Pass, Fail, Not tested, or Could not run for each line. Complete only the steps you reached.
      value: |
        Japanese UI:
        English UI:
        Public four-colour GLB:
        Orbit / pan / zoom:
        Full Spectrum preview:
        Flat Four F1-F4 only:
        Manual Fill / Undo / Redo:
        Output preparation / Solidify:
        3MF export:
        Snapmaker Orca open:
        Project save / reload:
    validations:
      required: false

  - type: input
    id: input_summary
    attributes:
      label: Test input summary
      description: Format, approximate triangles/parts, texture size, and generator if known. Do not identify or attach a private model.
      placeholder: Supplied public GLB, 48 triangles, four parts, no texture
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
        - Not yet retried
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Exact steps to reproduce
      description: Start from app launch and list the smallest repeatable sequence.
      placeholder: |
        1. Launch the app in English.
        2. Open the supplied public GLB.
        3. Select Flat Four.
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected result and actual result
      placeholder: |
        Expected:
        Actual:
        Longest wait before stopping (if it hung):
    validations:
      required: true

  - type: dropdown
    id: leftover_3mf
    attributes:
      label: After a failed export, was a new 3MF left behind?
      options:
        - "No"
        - "Yes"
        - Export did not fail
        - Not tested
    validations:
      required: true

  - type: input
    id: orca_result
    attributes:
      label: Snapmaker Orca version and result
      description: Optional. Include filaments shown and layer height, or write Not tested / Could not run.
      placeholder: Orca 2.x; opened; four filaments; 0.08 mm
    validations:
      required: false

  - type: textarea
    id: self_test
    attributes:
      label: Sanitized macOS alpha self-test result
      description: Source testers should paste the sanitized self-test JSON result or final Terminal lines. Gated app testers should state whether top-level ok was true. Remove personal paths and filenames.
      placeholder: Source launcher self-test passed/failed, ok=true, or sanitized final Terminal lines
    validations:
      required: true

  - type: textarea
    id: sanitized_evidence
    attributes:
      label: Sanitized screenshots or additional logs (optional)
      description: Attach only material you are allowed to share. Do not attach the model. Remove names, home paths, account details, serial numbers, and private filenames.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and alpha conditions
      options:
        - label: I did not attach or link a private, purchased, customer, or third-party model.
          required: true
        - label: I removed personal paths, account information, serial numbers, and other sensitive data.
          required: true
        - label: I understand the current Finder app and Source Tester are source-backed, a future self-contained app has a separate approval gate, and none is a supported public macOS Release.
          required: true
