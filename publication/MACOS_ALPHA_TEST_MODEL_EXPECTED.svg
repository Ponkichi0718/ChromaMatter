<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Expected ChromaMatter public four-colour test model</title>
  <desc id="desc">Four separate box-shaped solids arranged in a two-by-two square: red, blue, white, and black.</desc>
  <rect width="900" height="650" rx="24" fill="#111821"/>
