      <path d="m108 94 82-46v112l-82 46Z" fill="#a91f2b"/>
      <text x="95" y="245" text-anchor="middle" fill="#ffffff" stroke="none" font-family="Arial, sans-serif" font-size="24">RED</text>
    </g>
    <g transform="translate(500 92)">
      <path d="M0 44 82 0l108 48-82 46Z" fill="#4b7dff"/>
      <path d="m0 44 108 50v112L0 156Z" fill="#2053d7"/>
      <path d="m108 94 82-46v112l-82 46Z" fill="#163897"/>
      <text x="95" y="245" text-anchor="middle" fill="#ffffff" stroke="none" font-family="Arial, sans-serif" font-size="24">BLUE</text>
    </g>
    <g transform="translate(210 350)">
