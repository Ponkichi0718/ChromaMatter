  <g transform="translate(500 350)" stroke="#8fa4b8" stroke-width="3" stroke-linejoin="round">
    <path d="M0 44 82 0l108 48-82 46Z" fill="#2d3238"/>
    <path d="m0 44 108 50v112L0 156Z" fill="#111418"/>
    <path d="m108 94 82-46v112l-82 46Z" fill="#050607"/>
